name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . ruff
      - run: ruff check --select E9,F gradient_edu tests
      - run: pytest -q tests
      - run: gradient-edu demo --out /tmp/demo
