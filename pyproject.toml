[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-edu"
version = "0.1.0"
description = "Gamified, GitHub-graded labs for CS3491 Artificial Intelligence and Machine Learning"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anandharajan TRV", email = "trvanandharajan@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "pytest>=7"]
keywords = ["machine-learning", "education", "autograding", "github-classroom", "gamification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Education",
  "Topic :: Education",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/anandharajan/gradient-edu"

[project.scripts]
gradient-edu = "gradient_edu.cli:main"

[tool.setuptools]
packages = ["gradient_edu"]

[tool.setuptools.package-data]
gradient_edu = ["web/*.html"]
